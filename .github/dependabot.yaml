version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      stryker:
        patterns: ["@stryker-mutator/*"]
      commitlint:
        patterns: ["@commitlint/*"]
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore"
      include: "scope"
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "github/codeql-action/init"
      - dependency-name: "github/codeql-action/analyze"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
