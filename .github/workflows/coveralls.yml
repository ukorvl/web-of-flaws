name: Coveralls

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-scripts-check:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Python script checks and upload coverage
        uses: ./.github/actions/python-scripts-check
        with:
          upload-coverage: "true"
