name: Coveralls

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-scripts-check:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      - name: Set up CI runner
        uses: ./.github/actions/setup

      - name: Run Python script checks and upload coverage
        uses: ./.github/actions/python-scripts-check
        with:
          upload-coverage: "true"
