name: Coveralls

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-coverage:
    runs-on: ubuntu-24.04 # pinned for determinism
    timeout-minutes: 15
    steps:
      # Audit runner network, file, and process activity before enforcing egress rules.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up repository tooling
        uses: ./.github/actions/setup-tooling

      - name: Collect TypeScript coverage
        run: pnpm test:coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          format: lcov
          github-token: ${{ github.token }}
          fail-on-error: false
          coverage-reporter-version: v0.6.22 # pinned for determinism
