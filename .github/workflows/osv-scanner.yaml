name: OSV Scanner

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # Google OSV Scanner v2.5.0.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # yamllint disable-line rule:line-length

  scan-scheduled:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # Google OSV Scanner v2.5.0.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # yamllint disable-line rule:line-length
