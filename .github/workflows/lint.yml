name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run prek hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: 0.4.13 # pinned for determinism

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --verbose
            --max-retries 6
            --retry-wait-time 2
            --exclude 'https://coveralls\.io/github/ukorvl/web-of-flaws\?branch=master'
            './*.md'
            './**/*.md'
          lycheeVersion: v0.24.2 # pinned for determinism

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium
          version: v1.23.1 # pinned for determinism

  repo-structure:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check guide label configs
        run: python3 scripts/sync_guide_labels.py --check

      - name: Check generated catalog
        run: python3 scripts/generate_catalog.py --check

      - name: Lint guide metadata and allowlisted links
        run: python3 scripts/lint_repo.py

  python-scripts-check:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Python script checks
        uses: ./.github/actions/python-scripts-check
