name: Mutation Testing

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/actions/setup-tooling/**"
      - ".github/workflows/mutation.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "stryker.config.json"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-test:
    runs-on: ubuntu-24.04 # pinned for determinism
    timeout-minutes: 30
    steps:
      # Audit runner network, file, and process activity before enforcing egress rules.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository tooling
        uses: ./.github/actions/setup-tooling

      - name: Run mutation tests
        id: mutation-tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/run-mutation-tests.ts

      - name: Summarize mutation results
        if: always()
        run: node scripts/summarize-mutations.ts
