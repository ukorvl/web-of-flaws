name: Mutation Testing

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/mutation.yml"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-test:
    runs-on: ubuntu-24.04 # pinned for determinism
    steps:
      # Audit runner network, file, and process activity before enforcing egress rules.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # pinned for determinism

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5" # pinned for determinism

      - name: Install locked mutation test dependencies
        run: uv sync --locked --only-group mutation

      - name: Run mutation tests
        id: mutation-tests
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash .github/scripts/run-mutation-tests.sh

      # Keep the survivor report visible even when a mutation run fails.
      - name: Report mutation results
        if: always()
        run: uv run --locked --only-group mutation mutmut results
