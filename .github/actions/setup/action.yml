name: CI Setup
description: Audit runner activity and check out the repository without persisting credentials.

runs:
  using: composite
  steps:
    # Audit runner network, file, and process activity before enforcing egress rules.
    - name: Harden runner
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Check out repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
