name: Python Scripts Check
description: Lint, format-check, and test Python scripts, optionally uploading coverage to Coveralls.

inputs:
  upload-coverage:
    description: Upload the generated Cobertura report to Coveralls.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12" # pinned for determinism

    - name: Install repository tooling dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check -r requirements.txt

    - name: Install Ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        version: 0.16.0 # pinned for determinism

    - name: Install coverage.py
      if: inputs.upload-coverage == 'true'
      shell: bash
      run: python -m pip install --disable-pip-version-check coverage==7.16.0

    - name: Lint Python scripts
      shell: bash
      run: ruff check scripts

    - name: Check Python formatting
      shell: bash
      run: ruff format --check scripts

    - name: Run Python script unit tests
      if: inputs.upload-coverage != 'true'
      shell: bash
      run: python -m unittest discover -s scripts/tests -v

    - name: Run Python script unit tests with coverage
      if: inputs.upload-coverage == 'true'
      shell: bash
      run: python -m coverage run -m unittest discover -s scripts/tests -v

    - name: Generate coverage reports
      if: inputs.upload-coverage == 'true'
      shell: bash
      run: |
        python -m coverage report
        python -m coverage xml

    - name: Upload coverage to Coveralls
      if: inputs.upload-coverage == 'true'
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        file: coverage.xml
        format: cobertura
        github-token: ${{ github.token }}
