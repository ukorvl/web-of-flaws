default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # https://prek.j178.dev/builtin/
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://gitlab.com/bmares/check-json5
    rev: 82381b1133603e4ff6eb3d866ec4501d121b669b # v1.0.1
    hooks:
      - id: check-json5
        types_or: [file]
        files: \.(json|jsonc|json5)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
    hooks:
      - id: ruff-check
        files: ^scripts/.*\.py$
      - id: ruff-format
        files: ^scripts/.*\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        # Prek runs tracked files, but keep generated and dependency directories out if present.
        exclude: ^(?:\.agents/skills|\.npm|\.ruff_cache|\.venv|__pycache__|mutants|node_modules)/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # v4.4.0
    hooks:
      - id: conventional-pre-commit
