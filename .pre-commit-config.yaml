default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: repository-validation
        name: Validate formatting, types, tests, and repository integrity
        entry: pnpm validate
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: Check conventional commit message
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
